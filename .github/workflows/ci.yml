name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: questboard
          POSTGRES_USER: questboard
          POSTGRES_PASSWORD: questboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U questboard -d questboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ci-only-secret-key
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: questboard
      POSTGRES_USER: questboard
      POSTGRES_PASSWORD: questboard
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and quality tools
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Check formatting of changed Python
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          files=$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA" -- '*.py' | grep -vE '(^|/)migrations/' || true)
          if [ -n "$files" ]; then
            printf '%s\n' "$files" | xargs ruff format --check
          fi

      - name: Check model migration drift
        run: python manage.py makemigrations --check

      - name: Run Django system checks
        run: python manage.py check

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Validate OpenAPI schema
        run: python manage.py spectacular --file /tmp/schema.yml --validate

      - name: Run test suite
        run: python manage.py test config projects quests

      - name: Build Docker image
        run: docker build -t questboard:ci .
