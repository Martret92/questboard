[project]
name = "questboard"
version = "0.1.0"
description = "Backend-first collaborative workflow API with dependency-aware quests, project permissions, and auditable state transitions."
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2.16,<5.3",
    "dj-database-url>=3.1,<4",
    "djangorestframework>=3.17.1,<3.18",
    "drf-spectacular>=0.30,<0.31",
    "gunicorn>=23,<24",
    "psycopg[binary]>=3.3.4,<3.4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.12,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["config*", "projects*", "quests*"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["*/migrations/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
