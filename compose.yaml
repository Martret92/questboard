services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-questboard}
      POSTGRES_USER: ${POSTGRES_USER:-questboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-questboard}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-questboard} -d ${POSTGRES_DB:-questboard}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - questboard_postgres_data:/var/lib/postgresql/data

  app:
    build: .
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-docker-only-secret-key}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      POSTGRES_DB: ${POSTGRES_DB:-questboard}
      POSTGRES_USER: ${POSTGRES_USER:-questboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-questboard}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    command: >-
      sh -c "python manage.py migrate --noinput &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  questboard_postgres_data:
